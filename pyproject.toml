[project]
name = "8085-machine"
version = "0.1.0"
description = "A cycle-accurate 8085 microprocessor emulator written in Python simulating registers, flags, system bus signals, memory-mapped I/O peripherals, interrupts, and DMA transfers."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["F403", "F405"]
"src/tests/*.py" = ["E501", "I"]
"main.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/emu_8085"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "pytest",
]
